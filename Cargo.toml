[package]
name = "m2-ls"
version = "0.1.0"
edition = "2021"
description = "Language server for Macaulay2, built on Tree-sitter and a generated builtin metadata corpus"
license = "GPL-3.0-only"
repository = "https://github.com/AlexanderGolys/macaulay2-lsp"
readme = "README.md"
keywords = ["macaulay2", "lsp", "language-server", "tree-sitter"]
categories = ["development-tools"]

[dependencies]
tower-lsp = "0.20"
tower = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
tree-sitter = "0.26.9"
tree-sitter-macaulay2 = "3.0.2"
ropey = "1.6.1"
