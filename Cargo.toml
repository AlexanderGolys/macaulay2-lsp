[package]
name = "m2-ls"
version = "0.1.0"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tower = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
tree-sitter = "0.26.9"
tree-sitter-macaulay2 = "2.3.2"
ropey = "1.6.1"
